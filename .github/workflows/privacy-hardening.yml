name: Privacy Hardening Verification

on:
  push:
    branches:
      - hardening/privacy-engine-post-merge

jobs:
  privacy-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run full Python regression
        run: pytest -q
      - name: Run browser action regression
        run: node tests/action-handler.test.js
